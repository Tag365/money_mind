name: Build APK

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # NDK r28c (flutter.ndkVersion) isn't on the runner image; Gradle downloads it on a cache miss.
      # Update the version when a Flutter upgrade changes flutter.ndkVersion.
      - uses: actions/cache@v6
        with:
          # $ANDROID_HOME on ubuntu-latest; the runner's shell env isn't visible to ${{ env }}.
          path: /usr/local/lib/android/sdk/ndk/28.2.13676358
          key: ndk-${{ runner.os }}-28.2.13676358

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          flutter pub get

      - name: Test
        run: flutter test

      - name: Build APK
        run: |
          flutter build apk --release

      - uses: actions/upload-artifact@v7
        with:
          name: money_mind-apk
          path: build/app/outputs/flutter-apk/app-release.apk
