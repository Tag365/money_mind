name: Build APK

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # NDK r28c (flutter.ndkVersion) isn't on the runner image; Gradle downloads it on a cache miss.
      # Update the version when a Flutter upgrade changes flutter.ndkVersion.
      - uses: actions/cache@v6
        with:
          # $ANDROID_HOME on ubuntu-latest; the runner's shell env isn't visible to ${{ env }}.
          path: /usr/local/lib/android/sdk/ndk/28.2.13676358
          key: ndk-${{ runner.os }}-28.2.13676358

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          flutter pub get

      - name: Test
        run: flutter test --coverage

      # Line coverage per file from lcov.info, without generated *.g.dart files.
      - name: Coverage report
        run: |
          awk -F: '
            /^SF:/ { f = $2 }
            /^LF:/ { n = $2 }
            /^LH:/ { h = $2 }
            /^end_of_record/ && f !~ /\.g\.dart$/ {
              rows = rows sprintf("| %s | %d / %d | %.1f%% |\n", f, h, n, n ? 100 * h / n : 100)
              H += h; N += n
            }
            END {
              printf "### Coverage: %.1f%% (%d / %d lines)\n\n", N ? 100 * H / N : 100, H, N
              printf "<details><summary>Per file</summary>\n\n| File | Lines | Coverage |\n|---|---|---|\n%s\n</details>\n", rows
            }' coverage/lcov.info > coverage/summary.md
          cat coverage/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment coverage on PR
        # Fork PRs get a read-only token, so they can't comment.
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: coverage
          path: coverage/summary.md

      - name: Build APK
        run: |
          flutter build apk --release

      - uses: actions/upload-artifact@v7
        with:
          name: money_mind-apk
          path: build/app/outputs/flutter-apk/app-release.apk
