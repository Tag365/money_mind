name: Build APK

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A new push to a PR makes its running build obsolete. Runs on master publish
# releases, so each commit gets its own group and none is ever cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A merged PR was built from the same tree that lands on master (the ruleset
  # keeps PRs up to date), so master publishes that APK instead of rebuilding.
  promote:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # publish releases
      actions: read # download the PR's artifact
    outputs:
      number: ${{ steps.find.outputs.number }}
    steps:
      - uses: actions/checkout@v7

      - name: Find the merged PR's APK
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          # Fork PRs are built with the debug key, so only this repo's PRs count.
          heads=$(gh api "repos/$REPO/commits/$GITHUB_SHA/pulls" \
            --jq '.[] | select(.merged_at and .head.repo.full_name == env.REPO) | .head.sha')
          for head in $heads; do
            [ "$(gh api "repos/$REPO/commits/$head" --jq .commit.tree.sha)" = "$tree" ] || continue
            run=$(gh run list -R "$REPO" --workflow build-apk.yml --commit "$head" \
              --event pull_request --status success --limit 1 \
              --json databaseId,number --jq '.[0] // empty | "\(.databaseId) \(.number)"')
            [ -n "$run" ] || continue
            read -r id number <<< "$run"
            gh run download "$id" -R "$REPO" -n money_mind-apk -D apk || continue
            echo "Promoting the APK of run $number (PR head $head)"
            echo "number=$number" >> "$GITHUB_OUTPUT"
            exit 0
          done
          echo "No PR build of this tree; building it instead"

      - name: Publish release
        if: steps.find.outputs.number
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The APK's build number is the PR run's, so the tag uses it too.
          tag="v$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)+${{ steps.find.outputs.number }}"
          cp apk/app-release.apk "money_mind-$tag.apk"
          gh release create "$tag" "money_mind-$tag.apk" --target "$GITHUB_SHA" --title "$tag" --generate-notes

  build:
    needs: promote
    # Runs for PRs and manual runs (promote skipped), and on master when no PR
    # build could be promoted, or promote failed.
    if: ${{ !cancelled() && !needs.promote.outputs.number }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # publish releases
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # NDK r28c (flutter.ndkVersion) isn't on the runner image; Gradle downloads it on a cache miss.
      # Update the version when a Flutter upgrade changes flutter.ndkVersion.
      - uses: actions/cache@v6
        with:
          # $ANDROID_HOME on ubuntu-latest; the runner's shell env isn't visible to ${{ env }}.
          path: /usr/local/lib/android/sdk/ndk/28.2.13676358
          key: ndk-${{ runner.os }}-28.2.13676358

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          flutter pub get

      - name: Test
        run: flutter test --coverage

      # Line coverage per file from lcov.info, without generated *.g.dart files.
      - name: Coverage report
        run: |
          awk -F: '
            /^SF:/ { f = $2 }
            /^LF:/ { n = $2 }
            /^LH:/ { h = $2 }
            /^end_of_record/ && f !~ /\.g\.dart$/ {
              rows = rows sprintf("| %s | %d / %d | %.1f%% |\n", f, h, n, n ? 100 * h / n : 100)
              H += h; N += n
            }
            END {
              printf "### Coverage: %.1f%% (%d / %d lines)\n\n", N ? 100 * H / N : 100, H, N
              printf "<details><summary>Per file</summary>\n\n| File | Lines | Coverage |\n|---|---|---|\n%s\n</details>\n", rows
            }' coverage/lcov.info > coverage/summary.md
          cat coverage/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment coverage on PR
        # Fork PRs get a read-only token, so they can't comment.
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: coverage
          path: coverage/summary.md

      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            # Fork PRs get no secrets and build with the debug key; a release must never be debug-signed.
            [ "$GITHUB_REF" != refs/heads/master ] && exit 0
            echo "::error::KEYSTORE_BASE64 secret is missing" && exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Build APK
        run: |
          flutter build apk --release --build-number=${{ github.run_number }}

      - uses: actions/upload-artifact@v7
        with:
          name: money_mind-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish release
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)+${{ github.run_number }}"
          cp build/app/outputs/flutter-apk/app-release.apk "money_mind-$tag.apk"
          gh release create "$tag" "money_mind-$tag.apk" --target "$GITHUB_SHA" --title "$tag" --generate-notes
